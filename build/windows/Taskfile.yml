version: '3'
tasks:
  build:
    env:
      GOOS: windows
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: '0'
    cmds:
      - wails3 generate syso -arch {{.TARGET_ARCH}} -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_{{.TARGET_ARCH}}.syso
      - defer: '{{if eq OS "windows"}}cmd /c del{{else}}rm -f{{end}} wails_windows_{{.TARGET_ARCH}}.syso'
      - go build -tags desktop,production -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui" -o bin/SADPTools-windows-{{.TARGET_ARCH}}.exe .
  package:
    desc: Package the built Windows executable with the offline display runtime
    cmds:
      - python3 build/windows/package.py
