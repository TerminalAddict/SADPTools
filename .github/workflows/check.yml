name: Checks and Windows build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: go build ./cmd/sadptools
  windows-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s build/windows -p 'test_*.py'
      - run: make tools windows-installer
      - run: 7z t bin/SADPTools-Setup-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SADPTools-Windows-installer
          path: |
            bin/SADPTools-Setup-windows-amd64.exe
            bin/SADPTools-Setup-windows-amd64.exe.sha256
