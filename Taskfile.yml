version: '3'
vars:
  GOOS: '{{.GOOS | default OS}}'
  TARGET_ARCH: '{{.GOARCH | default ARCH}}'
  APP_VERSION: '{{.SADPTOOLS_VERSION | default "0.2.0-dev"}}'
includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
tasks:
  build:
    desc: Build the desktop application (GOOS=windows or linux)
    cmds:
      - task: common:frontend
      - task: '{{.GOOS}}:build'
  run:
    cmds:
      - 'bin/SADPTools-{{.GOOS}}-{{.TARGET_ARCH}}{{if eq .GOOS "windows"}}.exe{{end}}'
  package:
    desc: Build the Windows AMD64 offline installer
    preconditions:
      - sh: '[ "{{.GOOS}}" = "windows" ] && [ "{{.TARGET_ARCH}}" = "amd64" ]'
        msg: Installer packaging currently supports GOOS=windows GOARCH=amd64.
    cmds:
      - task: build
      - task: windows:package
  dev:
    cmds:
      - wails3 dev -config build/config.yml
